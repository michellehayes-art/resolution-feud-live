<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>

  <!-- Radial Glow Behind Trophy/Arch -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- Stage Arch -->
  <path d="M 120 370 A 136 136 0 0 1 392 370" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 150 370 A 106 106 0 0 1 362 370" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Heart / Handshake Centerpiece -->
  <path d="M 256 200 C 230 160 170 170 170 215 C 170 260 256 310 256 310 C 256 310 342 260 342 215 C 342 170 282 160 256 200 Z" fill="url(#gold)"/>

  <!-- Star accents -->
  <polygon points="256,110 263,128 282,128 266,139 272,157 256,146 240,157 246,139 230,128 249,128" fill="#fbbf24"/>
  <circle cx="160" cy="150" r="6" fill="#fbbf24"/>
  <circle cx="352" cy="150" r="6" fill="#fbbf24"/>

  <!-- Base Platform -->
  <rect x="136" y="370" width="240" height="24" rx="12" fill="url(#gold)"/>
  <rect x="176" y="404" width="160" height="16" rx="8" fill="url(#gold)" opacity="0.8"/>
</svg>
